<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>フィジオマップ｜アクセスページ</title>
<style>
  html, body { margin:0; background:#F6F2EC; color:#14262A; font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:64px 20px; text-align:center; }
  .badge { display:inline-block; font-size:13px; letter-spacing:.06em; background:#E1EDEA; color:#0C3B3F; padding:6px 14px; border-radius:99px; }
  h1 { font-size:24px; line-height:1.5; margin:18px 0 10px; color:#0C3B3F; }
  p { font-size:16px; line-height:1.8; color:#4A5A5C; }
  .card { background:#fff; border:1px solid #E3DDD3; border-radius:16px; padding:24px 20px; margin-top:28px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#2E8A7A; margin-right:8px; animation:p 1.6s infinite; }
  @keyframes p { 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none; } }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">ご購入ありがとうございます</span>
    <h1>フィジオマップ · 評価からリハビリまで54テーマ・160ページ超のビジュアルマップ · 無料特典3点</h1>
    <p>ただいま教材の最終準備をしています。このページに、すべての教材が順次表示されます。</p>
    <div class="card">
      <p><span class="dot"></span><strong>このリンクを保存してください</strong></p>
      <p>あなた専用の永久アクセスページです。数時間後にもう一度開くと、本編と特典がすべてそろっています。</p>
    </div>
    <p style="margin-top:28px">次のステップ：このページをブックマークしておきましょう。</p>
  </div>
</body>
</html>
